provider_design_state:
  vast_serverless:
    release_scope: mentat_1_0
    live_validation: incomplete
  vast_direct_instance:
    release_scope: target_expansion_unless_owner_changes_scope
    live_validation: not_started
  rules:
    - fetch https://docs.vast.ai/llms.txt before changing Vast behavior and discover the current relevant provider pages
    - separate provider read spend and billing concerns
    - pass broker-owned credentials explicitly rather than relying on ambient SDK key discovery
    - least-privilege permissions must be live-validated
    - no hidden automatic retry for ambiguous non-idempotent paid mutations
    - normalize provider state errors and market data at the adapter boundary
    - treat provider benchmarks and market signals as priors rather than verified task-quality evidence
    - reconcile component-level cost to actual billing when available
    - keep provider state separate from Mentat execution state

broker_safety_state:
  required_for_mentat_1_0:
    - authenticated bounded approval leases
    - worst-case spend bounds
    - MNT-411 spend governor and atomic budget reservation before spend-increasing actions
    - one narrow spend authority
    - global paid-compute kill switch
    - MNT-412 explicit paid execution state machine
    - atomic legal state transitions where concurrency can race
    - ambiguous remote state reconciled before another paid mutation
    - failure-specific fallback and circuit breakers
  learning_boundary:
    - learning may improve predictions preferences and exploration inside the eligible set
    - learning may not weaken credential approval spend security quality or risk floors
    - malformed failed interrupted or unverified results cannot become positive quality evidence

owner_blockers:
  - standalone private repository migration before real credentials or paid tests
  - clean Windows target-PC validation
  - real Vast API key entry and paid canary approval
  - Authenticode signing certificate for release

forbidden_until_gates_change:

name: Mentat Probability Range Repair

on:
  pull_request:
    paths:
      - ".github/workflows/mentat-probability-repair-once.yml"

permissions:
  contents: read

concurrency:
  group: mentat-probability-range-repair
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/shot2-owner-gate1-evidence'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/shot2-owner-gate1-evidence
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic probability bounds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("services/model-broker/mentat_broker/intelligence.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          low = "success_low = max(0.0, adjusted - half - penalty)"
          high = "success_high = min(1.0, adjusted + half)"
          for index, line in enumerate(lines[:-1]):
              if line.strip() == low and lines[index + 1].strip() == high:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index : index + 2] = [
                      indent + "success_low = min(",
                      indent + "    success_center,",
                      indent + "    max(0.0, adjusted - half - penalty),",
                      indent + ")",
                      indent + "success_high = max(",
                      indent + "    success_center,",
                      indent + "    min(1.0, adjusted + half),",
                      indent + ")",
                  ]
                  break
          else:
              raise SystemExit("probability-bound assignments are missing")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Validate broker on platform
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest ruff
          cd services/model-broker
          ruff check mentat_broker/intelligence.py tests/test_intelligence_v1.py
          pytest -q tests/test_intelligence_v1.py
          pytest -q

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/shot2-owner-gate1-evidence
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply validated probability repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("services/model-broker/mentat_broker/intelligence.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          low = "success_low = max(0.0, adjusted - half - penalty)"
          high = "success_high = min(1.0, adjusted + half)"
          for index, line in enumerate(lines[:-1]):
              if line.strip() == low and lines[index + 1].strip() == high:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index : index + 2] = [
                      indent + "success_low = min(",
                      indent + "    success_center,",
                      indent + "    max(0.0, adjusted - half - penalty),",
                      indent + ")",
                      indent + "success_high = max(",
                      indent + "    success_center,",
                      indent + "    min(1.0, adjusted + half),",
                      indent + ")",
                  ]
                  break
          else:
              raise SystemExit("probability-bound assignments are missing")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m pip install pytest ruff
          cd services/model-broker
          ruff check mentat_broker tests ../../scripts/mentat/testing
          pytest -q
          cd ../..
          python scripts/mentat/testing/no_spend_acceptance.py \
            --report "$RUNNER_TEMP/mentat-no-spend-probability-repair.json"
          python scripts/mentat/testing/release_candidate_acceptance.py \
            --report "$RUNNER_TEMP/mentat-v1-probability-repair.json"
          git diff --check
      - name: Remove repair workflow and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mentat-probability-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: order probability bounds deterministically"
          git push origin HEAD:agent/shot2-owner-gate1-evidence

name: Mentat Broker

on:
  pull_request:
    paths:
      - "services/model-broker/**"
      - "config/model-registry.json"
      - "scripts/mentat/broker.py"
      - "scripts/mentat/vast_endpoint*.py"
      - "scripts/mentat/vast_http.py"
      - "scripts/mentat/testing/**"
      - "infrastructure/vast/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/mentat-broker.yml"
  push:
    branches: [main, agent/shot2-owner-gate1-evidence]
    paths:
      - "services/model-broker/**"
      - "config/model-registry.json"
      - "scripts/mentat/broker.py"
      - "scripts/mentat/vast_endpoint*.py"
      - "scripts/mentat/vast_http.py"
      - "scripts/mentat/testing/**"
      - "infrastructure/vast/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/mentat-broker.yml"

permissions:
  contents: read

jobs:
  refresh-python-format:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/agent/shot2-owner-gate1-evidence' &&
       !contains(github.event.head_commit.message, '[python-refresh]')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/shot2-owner-gate1-evidence')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shot2-owner-gate1-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Route the no-spend fixture through the production authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/mentat/testing/no_spend_acceptance.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '            "MENTAT_VAST_BUNDLES_URL",\n',
              '            "MENTAT_VAST_BUNDLES_URL",\n            "VAST_TEMPLATE_HASH",\n',
          )
          text = text.replace(
              '                "MENTAT_VAST_BUNDLES_URL": vast_base + "/bundles/",\n',
              '                "MENTAT_VAST_BUNDLES_URL": vast_base + "/bundles/",\n                "VAST_TEMPLATE_HASH": "fake-template",\n',
          )
          old = '''        broker_base = start_broker()
          model = application.registry.get("kimi-k2.7-code")
          offer = Offer(
              id=501,
              gpu_name="H200",
              num_gpus=8,
              gpu_ram_mb=141000,
              hourly_usd=24,
              reliability=0.995,
              verified=True,
              bw_nvlink=900,
              disk_space_gb=1000,
          )
          now = datetime.now(UTC)
          application.store.upsert_session(
              model.id,
              status="ready",
              endpoint_url=upstream_base,
              hourly_usd=offer.hourly_usd,
              offer=offer,
              decision_id="no-spend-approved-session",
              started_at=now.isoformat(),
              last_used_at=now.isoformat(),
              approved_until=(now + timedelta(minutes=30)).isoformat(),
          )
          '''
          new = '''        broker_base = start_broker()
          application.v1.settings.update(
              {
                  "setup_complete": True,
                  "privacy_mode": "remote_allowed",
                  "remote_inference_enabled": True,
                  "budgets": {
                      "maximum_hourly_usd": 32,
                      "maximum_session_usd": 64,
                      "maximum_daily_usd": 128,
                      "maximum_monthly_usd": 1280,
                      "maximum_retry_usd": 8,
                      "maximum_fallback_usd": 16,
                      "maximum_exploration_usd": 4,
                      "one_paid_session": True,
                  },
              }
          )
          model = application.registry.get("kimi-k2.7-code")
          seed_decision = application.plan(
              {
                  "prompt": "Validate the fake Vast production authority path",
                  "requires_tools": True,
                  "estimated_input_tokens": 2048,
                  "max_hourly_usd": 32,
                  "max_total_usd": 64,
              }
          )
          application.approve(
              seed_decision.id,
              {"accept_benchmark_cost": True},
          )
          application.sessions.wait_until_ready(model, timeout_seconds=10)
          application.authority.provider_ready(seed_decision, model)
          '''
          if old in text:
              text = text.replace(old, new)
          elif "Validate the fake Vast production authority path" not in text:
              raise SystemExit("no-spend fixture block changed unexpectedly")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply focused Python lint and format repairs
        run: |
          python -m pip install ruff
          ruff check --config services/model-broker/pyproject.toml --fix --unsafe-fixes services/model-broker/mentat_broker services/model-broker/tests scripts/mentat/testing
          ruff format --config services/model-broker/pyproject.toml services/model-broker/mentat_broker services/model-broker/tests scripts/mentat/testing
      - name: Commit generated Python repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Python files are synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/model-broker/mentat_broker services/model-broker/tests scripts/mentat/testing
          git commit -m "chore: synchronize broker Python [python-refresh]"
          git push origin "HEAD:agent/shot2-owner-gate1-evidence"

  broker-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test tools
        working-directory: services/model-broker
        run: python -m pip install pytest ruff
      - name: Lint broker
        working-directory: services/model-broker
        shell: bash
        run: |
          set -o pipefail
          ruff check mentat_broker tests ../../scripts/mentat/testing --output-format concise 2>&1 | tee ruff-report.txt
      - name: Upload broker lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-lint-${{ matrix.os }}
          path: services/model-broker/ruff-report.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile broker and acceptance tools
        run: |
          python -m compileall -q services/model-broker/mentat_broker services/model-broker/tests scripts/mentat/testing
      - name: Test deterministic routing, storage, and registry
        working-directory: services/model-broker
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest-results.xml 2>&1 | tee pytest-report.txt
      - name: Upload broker test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-tests-${{ matrix.os }}
          path: |
            services/model-broker/pytest-report.txt
            services/model-broker/pytest-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Validate committed broker configuration
        env:
          MENTAT_BROKER_CLIENT_TOKEN: check-client
          MENTAT_BROKER_ADMIN_TOKEN: check-admin
        run: python scripts/mentat/broker.py --root . --data-dir "${{ runner.temp }}/broker" --check
      - name: Run no-spend production acceptance harness
        shell: bash
        run: |
          python scripts/mentat/testing/no_spend_acceptance.py --report "${{ runner.temp }}/mentat-no-spend-${{ matrix.os }}.json"
      - name: Run Mentat 1.0 zero-dollar release acceptance
        shell: bash
        run: |
          python scripts/mentat/testing/release_candidate_acceptance.py --report "${{ runner.temp }}/mentat-v1-${{ matrix.os }}.json"
      - name: Upload no-spend acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentat-no-spend-${{ matrix.os }}
          path: ${{ runner.temp }}/mentat-no-spend-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Mentat 1.0 release acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentat-v1-${{ matrix.os }}
          path: ${{ runner.temp }}/mentat-v1-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30

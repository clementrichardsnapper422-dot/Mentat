name: Mentat Broker

on:
  pull_request:
    paths:
      - "services/model-broker/**"
      - "config/model-registry.json"
      - "scripts/mentat/broker.py"
      - "scripts/mentat/vast_endpoint*.py"
      - "scripts/mentat/vast_http.py"
      - "scripts/mentat/testing/**"
      - "infrastructure/vast/**"
      - ".github/workflows/mentat-broker.yml"
  push:
    branches: [main]
    paths:
      - "services/model-broker/**"
      - "config/model-registry.json"
      - "scripts/mentat/broker.py"
      - "scripts/mentat/vast_endpoint*.py"
      - "scripts/mentat/vast_http.py"
      - "scripts/mentat/testing/**"
      - "infrastructure/vast/**"
      - ".github/workflows/mentat-broker.yml"

permissions:
  contents: read

jobs:
  broker-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test tools
        working-directory: services/model-broker
        run: python -m pip install pytest ruff
      - name: Lint broker
        working-directory: services/model-broker
        shell: bash
        run: |
          set -o pipefail
          ruff check mentat_broker tests ../../scripts/mentat/testing --output-format concise 2>&1 | tee ruff-report.txt
      - name: Upload broker lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-lint-${{ matrix.os }}
          path: services/model-broker/ruff-report.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile broker and acceptance tools
        run: |
          python -m compileall -q services/model-broker/mentat_broker services/model-broker/tests scripts/mentat/testing
      - name: Test deterministic routing, storage, and registry
        working-directory: services/model-broker
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest-results.xml 2>&1 | tee pytest-report.txt
      - name: Upload broker test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-tests-${{ matrix.os }}
          path: |
            services/model-broker/pytest-report.txt
            services/model-broker/pytest-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Validate committed broker configuration
        env:
          MENTAT_BROKER_CLIENT_TOKEN: check-client
          MENTAT_BROKER_ADMIN_TOKEN: check-admin
        run: python scripts/mentat/broker.py --root . --data-dir "${{ runner.temp }}/broker" --check
      - name: Run no-spend production acceptance harness
        shell: bash
        run: |
          python scripts/mentat/testing/no_spend_acceptance.py --report "${{ runner.temp }}/mentat-no-spend-${{ matrix.os }}.json"
      - name: Run Mentat 1.0 zero-dollar release acceptance
        shell: bash
        run: |
          python scripts/mentat/testing/release_candidate_acceptance.py --report "${{ runner.temp }}/mentat-v1-${{ matrix.os }}.json"
      - name: Upload no-spend acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentat-no-spend-${{ matrix.os }}
          path: ${{ runner.temp }}/mentat-no-spend-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Mentat 1.0 release acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentat-v1-${{ matrix.os }}
          path: ${{ runner.temp }}/mentat-v1-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30

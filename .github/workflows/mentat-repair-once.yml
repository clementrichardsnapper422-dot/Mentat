name: Mentat One-Shot Repair

on:
  pull_request:
    paths:
      - ".github/workflows/mentat-repair-once.yml"

permissions:
  contents: write

concurrency:
  group: mentat-one-shot-repair
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/shot2-owner-gate1-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/shot2-owner-gate1-evidence
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Activate repository pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          node --version
          pnpm --version

      - name: Align settings, authority, and backup controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          acceptance = Path("scripts/mentat/testing/no_spend_acceptance.py")
          text = acceptance.read_text(encoding="utf-8")
          start_marker = "        application.v1.settings.update(\n"
          end_marker = "\n        model = application.registry.get"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("no-spend settings update marker is missing")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("no-spend model marker is missing")
          replacement = "\n".join(
              [
                  "        application.v1.settings.complete_setup(",
                  "            {",
                  '                "workspace": str(data_dir.resolve()),',
                  '                "privacy_mode": "remote_allowed",',
                  '                "remote_inference_enabled": True,',
                  '                "one_paid_session": True,',
                  '                "budgets": {',
                  '                    "maximum_hourly_usd": 32,',
                  '                    "maximum_session_usd": 64,',
                  '                    "maximum_daily_usd": 128,',
                  '                    "maximum_monthly_usd": 1280,',
                  '                    "maximum_retry_usd": 8,',
                  '                    "maximum_fallback_usd": 16,',
                  '                    "maximum_exploration_usd": 3,',
                  "                },",
                  "            }",
                  "        )",
              ]
          )
          acceptance.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          tests = Path("services/model-broker/tests/test_single_authority.py")
          text = tests.read_text(encoding="utf-8")
          failure_old = "\n".join(
              [
                  '    with pytest.raises(RuntimeError, match="proposal failed"):',
                  "        with candidate_proposal_scope(application):",
                  '            raise RuntimeError("proposal failed")',
              ]
          )
          failure_new = "\n".join(
              [
                  "    with (",
                  '        pytest.raises(RuntimeError, match="proposal failed"),',
                  "        candidate_proposal_scope(application),",
                  "    ):",
                  '        raise RuntimeError("proposal failed")',
              ]
          )
          nested_old = "\n".join(
              [
                  "    with candidate_proposal_scope(application):",
                  '        with pytest.raises(AuthorityBypassError, match="nested"):',
                  "            with candidate_proposal_scope(application):",
                  "                pass",
              ]
          )
          nested_new = "\n".join(
              [
                  "    with (",
                  "        candidate_proposal_scope(application),",
                  '        pytest.raises(AuthorityBypassError, match="nested"),',
                  "    ):",
                  "        with candidate_proposal_scope(application):",
                  "            pass",
              ]
          )
          if failure_old not in text or nested_old not in text:
              raise SystemExit("single-authority test markers are missing")
          tests.write_text(
              text.replace(failure_old, failure_new).replace(nested_old, nested_new),
              encoding="utf-8",
          )

          runtime = Path("services/model-broker/mentat_broker/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          runtime_old = "        self._validate_settings_against_hard_policy(self.settings.load())"
          runtime_new = "\n".join(
              [
                  "        settings = self.settings.load()",
                  "        # First-run defaults cannot authorize paid compute, so they must not",
                  "        # prevent startup under a tighter deployment policy. Explicit settings",
                  "        # updates and completed setup remain strictly validated below.",
                  "        if settings.setup_completed:",
                  "            self._validate_settings_against_hard_policy(settings)",
              ]
          )
          if runtime_old not in text:
              raise SystemExit("runtime startup policy marker is missing")
          runtime.write_text(text.replace(runtime_old, runtime_new, 1), encoding="utf-8")

          settings = Path("services/model-broker/mentat_broker/settings.py")
          text = settings.read_text(encoding="utf-8")
          settings_old = "\n".join(
              [
                  '            if key == "budgets":',
                  "                if not isinstance(value, dict):",
                  '                    raise ValueError("budgets must be an object")',
                  '                current["budgets"] = {**current["budgets"], **value}',
                  "            else:",
              ]
          )
          settings_new = "\n".join(
              [
                  '            if key == "budgets":',
                  "                if not isinstance(value, dict):",
                  '                    raise ValueError("budgets must be an object")',
                  '                merged_budgets = {**current["budgets"], **value}',
                  '                if "maximum_session_usd" in value:',
                  '                    session_ceiling = float(value["maximum_session_usd"])',
                  "                    for dependent_limit in (",
                  '                        "maximum_retry_usd",',
                  '                        "maximum_fallback_usd",',
                  '                        "maximum_exploration_usd",',
                  "                    ):",
                  "                        if dependent_limit not in value:",
                  "                            merged_budgets[dependent_limit] = min(",
                  "                                float(merged_budgets[dependent_limit]),",
                  "                                session_ceiling,",
                  "                            )",
                  '                current["budgets"] = merged_budgets',
                  "            else:",
              ]
          )
          if settings_old not in text:
              raise SystemExit("settings budget merge marker is missing")
          settings.write_text(text.replace(settings_old, settings_new, 1), encoding="utf-8")

          diagnostics = Path("services/model-broker/mentat_broker/diagnostics.py")
          text = diagnostics.read_text(encoding="utf-8")
          backup_start = text.find("    def create_backup(self) -> dict[str, Any]:\n")
          if backup_start < 0:
              raise SystemExit("diagnostics backup marker is missing")
          backup_replacement = indent(
              dedent(
                  '''\
                  def create_backup(self) -> dict[str, Any]:
                      """Create a consistent local recovery archive with a hashed manifest."""

                      diagnostics = self.run(include_docker=False)
                      if not diagnostics["passed"]:
                          raise RuntimeError("backup refused because local state diagnostics failed")
                      self.backup_dir.mkdir(parents=True, exist_ok=True)
                      timestamp = utc_now().replace(":", "-").replace("+", "_")
                      destination = self.backup_dir / f"mentat-state-{timestamp}.zip"
                      sidecar_suffixes = ("-wal", "-shm", "-journal")
                      database_names = set(self.DATABASES)
                      non_database_sources = [
                          path
                          for path in sorted(self.data_dir.rglob("*"))
                          if path.is_file()
                          and path.name not in database_names
                          and not path.name.endswith(sidecar_suffixes)
                      ]
                      descriptor, temp_name = tempfile.mkstemp(
                          prefix=destination.name + ".",
                          suffix=".tmp",
                          dir=self.backup_dir,
                      )
                      os.close(descriptor)
                      try:
                          with tempfile.TemporaryDirectory(
                              prefix="mentat-backup-stage-",
                              dir=self.backup_dir,
                          ) as staging_name:
                              staging = Path(staging_name)
                              for source in non_database_sources:
                                  relative = source.relative_to(self.data_dir)
                                  target = staging / relative
                                  target.parent.mkdir(parents=True, exist_ok=True)
                                  shutil.copy2(source, target)

                              for name in self.DATABASES:
                                  source = self.data_dir / name
                                  target = staging / name
                                  source_connection = sqlite3.connect(
                                      f"file:{source}?mode=ro",
                                      uri=True,
                                      timeout=30,
                                  )
                                  target_connection = sqlite3.connect(target, timeout=30)
                                  try:
                                      source_connection.backup(target_connection)
                                      target_connection.commit()
                                      result = target_connection.execute(
                                          "PRAGMA integrity_check"
                                      ).fetchone()
                                      if not result or result[0] != "ok":
                                          raise RuntimeError(
                                              f"backup snapshot integrity failed for {name}: {result}"
                                          )
                                  finally:
                                      target_connection.close()
                                      source_connection.close()

                              files = [
                                  path
                                  for path in sorted(staging.rglob("*"))
                                  if path.is_file()
                                  and not path.name.endswith(sidecar_suffixes)
                              ]
                              manifest = {
                                  "schema_version": 1,
                                  "created_at": utc_now(),
                                  "sensitive": True,
                                  "warning": (
                                      "This archive contains local spend authority and must be "
                                      "stored like a credential."
                                  ),
                                  "files": [
                                      {
                                          "path": path.relative_to(staging).as_posix(),
                                          "size": path.stat().st_size,
                                          "sha256": _sha256(path),
                                      }
                                      for path in files
                                  ],
                              }
                              with zipfile.ZipFile(
                                  temp_name,
                                  "w",
                                  compression=zipfile.ZIP_DEFLATED,
                                  compresslevel=9,
                              ) as archive:
                                  for path in files:
                                      archive.write(path, path.relative_to(staging).as_posix())
                                  archive.writestr(
                                      "backup-manifest.json",
                                      json.dumps(manifest, indent=2) + "\\n",
                                  )
                          os.replace(temp_name, destination)
                          with suppress(OSError):
                              os.chmod(destination, 0o600)
                      finally:
                          if os.path.exists(temp_name):
                              os.unlink(temp_name)
                      return {
                          "schema_version": 1,
                          "created_at": manifest["created_at"],
                          "path": str(destination),
                          "size": destination.stat().st_size,
                          "sha256": _sha256(destination),
                          "sensitive": True,
                          "file_count": len(files),
                      }
                  '''
              ),
              "    ",
          )
          diagnostics.write_text(
              text[:backup_start] + backup_replacement.rstrip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Format and lint broker Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest ruff
          ruff check --config services/model-broker/pyproject.toml --fix --unsafe-fixes \
            services/model-broker/mentat_broker \
            services/model-broker/tests \
            scripts/mentat/testing
          ruff format --config services/model-broker/pyproject.toml \
            services/model-broker/mentat_broker \
            services/model-broker/tests \
            scripts/mentat/testing
          ruff check --config services/model-broker/pyproject.toml \
            services/model-broker/mentat_broker \
            services/model-broker/tests \
            scripts/mentat/testing

      - name: Regenerate and verify dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          python - <<'PY'
          from pathlib import Path

          targets = (
              "@opentelemetry/propagator-jaeger",
              "axios",
              "brace-expansion",
              "fast-uri",
              "postcss",
          )
          resolved = {target: set() for target in targets}
          for raw in Path("pnpm-lock.yaml").read_text(encoding="utf-8").splitlines():
              line = raw.strip().strip("'")
              if not line.endswith(":"):
                  continue
              key = line[:-1]
              for target in targets:
                  prefix = target + "@"
                  if key.startswith(prefix):
                      resolved[target].add(key[len(prefix) :])
          for target, versions in resolved.items():
              print(f"{target}: {', '.join(sorted(versions)) or '<missing>'}")
          PY
          node scripts/pre-commit/pnpm-audit-prod.mjs --audit-level=high

      - name: Run focused release proof
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            services/model-broker/mentat_broker \
            services/model-broker/tests \
            scripts/mentat/testing
          (
            cd services/model-broker
            pytest -q
          )
          python scripts/mentat/testing/no_spend_acceptance.py \
            --report "$RUNNER_TEMP/mentat-no-spend-repair.json"
          python scripts/mentat/testing/release_candidate_acceptance.py \
            --report "$RUNNER_TEMP/mentat-v1-repair.json"
          git diff --check

      - name: Remove repair workflow and publish immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mentat-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes were produced."
            exit 1
          fi
          git commit -m "fix: synchronize Mentat release candidate"
          git push origin HEAD:agent/shot2-owner-gate1-evidence

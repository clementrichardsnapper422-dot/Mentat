name: Mentat Repository Contract Repair

on:
  pull_request:
    paths:
      - ".github/workflows/mentat-repo-contract-repair-once.yml"

permissions:
  contents: write

concurrency:
  group: mentat-repository-contract-repair
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/shot2-owner-gate1-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/shot2-owner-gate1-evidence
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Activate repository pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile

      - name: Align repository contracts
        shell: python
        run: |
          from pathlib import Path

          workspace = Path("pnpm-workspace.yaml")
          text = workspace.read_text(encoding="utf-8")
          marker = "  axios: 1.18.1\n"
          replacement = (
              "  axios: 1.18.1\n"
              '  "axios>agent-base": 7.1.4\n'
              '  "axios>https-proxy-agent": 7.0.6\n'
          )
          if marker not in text:
              raise SystemExit("Axios override marker is missing")
          if "axios>agent-base" not in text:
              text = text.replace(marker, replacement, 1)
          workspace.write_text(text, encoding="utf-8")

          knip = Path("config/knip.config.ts")
          text = knip.read_text(encoding="utf-8")
          marker = '  "apps/android/scripts/build-release-artifacts.ts!",\n'
          replacement = "\n".join(
              [
                  '  "apps/android/scripts/build-release-artifacts.ts!",',
                  "  // Electron, installer, and no-spend wrappers load these by package metadata",
                  "  // or assembled filesystem paths rather than static imports.",
                  '  "apps/mentat-desktop/src/main-production.cjs!",',
                  '  "apps/mentat-desktop/src/main.cjs!",',
                  '  "apps/mentat-desktop/src/no-spend-command.cjs!",',
                  '  "apps/mentat-desktop/src/no-spend-cli.cjs!",',
                  "",
              ]
          )
          if marker not in text:
              raise SystemExit("Knip repository entry marker is missing")
          if "apps/mentat-desktop/src/main-production.cjs!" not in text:
              text = text.replace(marker, replacement, 1)
          knip.write_text(text, encoding="utf-8")

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/oxfmt \
            docs/mentat/threat-model.md \
            docs/mentat/work-items.md \
            scripts/mentat/package-windows-runtime.mjs \
            scripts/mentat/package-windows-runtime.test.mjs \
            scripts/mentat/runtime-package-layout.mjs \
            services/model-broker/pyproject.toml \
            services/vast-compute-manager/pyproject.toml \
            config/knip.config.ts

      - name: Regenerate lock and stale shrinkwrap authorities
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          node scripts/generate-npm-shrinkwrap.mjs \
            --jobs 6 \
            --package-dir . \
            --package-dir extensions/acpx \
            --package-dir extensions/diagnostics-otel \
            --package-dir extensions/feishu \
            --package-dir extensions/lobster \
            --package-dir extensions/slack

      - name: Prove repository contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:format:check
          pnpm format:check
          pnpm deadcode:dependencies
          pnpm deadcode:unused-files
          pnpm deadcode:exports
          pnpm deps:shrinkwrap:check
          node scripts/pre-commit/pnpm-audit-prod.mjs --audit-level=high
          pnpm --dir apps/mentat-desktop check
          pnpm --dir apps/mentat-desktop test
          (
            cd services/model-broker
            python -m pip install pytest ruff
            ruff check mentat_broker tests ../../scripts/mentat/testing
            pytest -q
          )
          python scripts/mentat/testing/no_spend_acceptance.py \
            --report "$RUNNER_TEMP/mentat-no-spend-repo-contract.json"
          python scripts/mentat/testing/release_candidate_acceptance.py \
            --report "$RUNNER_TEMP/mentat-v1-repo-contract.json"
          git diff --check

      - name: Remove repair workflow and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mentat-repo-contract-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository-contract repairs were produced."
            exit 1
          fi
          git commit -m "fix: synchronize repository release contracts"
          git push origin HEAD:agent/shot2-owner-gate1-evidence

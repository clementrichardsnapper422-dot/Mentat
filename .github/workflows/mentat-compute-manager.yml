name: Mentat Compute Manager

on:
  pull_request:
    paths:
      - "services/vast-compute-manager/**"
      - ".github/workflows/mentat-compute-manager.yml"
  push:
    branches: [main]
    paths:
      - "services/vast-compute-manager/**"
      - ".github/workflows/mentat-compute-manager.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vast-compute-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/vast-compute-manager/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest
      - run: docker build -t mentat-vast-compute-manager:test .

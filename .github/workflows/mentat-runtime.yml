name: Mentat Runtime

on:
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.cmd"
      - "README.md"
      - "config/mentat.env.example"
      - "config/model-registry.json"
      - "scripts/mentat/**"
      - "services/model-broker/**"
      - "infrastructure/vast/**"
      - "docs/mentat/**"
      - ".github/workflows/mentat-runtime.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.cmd"
      - "README.md"
      - "config/mentat.env.example"
      - "config/model-registry.json"
      - "scripts/mentat/**"
      - "services/model-broker/**"
      - "infrastructure/vast/**"
      - "docs/mentat/**"
      - ".github/workflows/mentat-runtime.yml"

permissions:
  contents: read

jobs:
  validate-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Mentat shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/mentat/install.sh
          bash -n scripts/mentat/launch.sh
          bash -n scripts/mentat/mentat.sh
          bash -n scripts/mentat/doctor.sh
      - name: Verify installer help
        run: bash install.sh --help | grep -Fq 'Install Mentat'
      - name: Verify unified command help
        run: bash scripts/mentat/mentat.sh help | grep -Fq 'mentat vast'
      - name: Verify local configuration path
        run: |
          output="$(MENTAT_CONFIG_DIR="$RUNNER_TEMP/mentat" bash scripts/mentat/mentat.sh config path)"
          test "$output" = "$RUNNER_TEMP/mentat/env"
      - name: Compile endpoint and broker entry points
        run: |
          python -m py_compile \
            scripts/mentat/broker.py \
            scripts/mentat/vast_endpoint.py \
            scripts/mentat/vast_endpoint_production.py \
            scripts/mentat/vast_endpoint_hardening.py \
            scripts/mentat/vast_http.py \
            scripts/mentat/testing/fake_vast.py \
            scripts/mentat/testing/fake_openai.py \
            scripts/mentat/testing/no_spend_acceptance.py
      - name: Validate model registry and broker configuration
        env:
          MENTAT_BROKER_CLIENT_TOKEN: check-client
          MENTAT_BROKER_ADMIN_TOKEN: check-admin
        run: python scripts/mentat/broker.py --root . --data-dir "$RUNNER_TEMP/broker" --check >broker.json
      - name: Validate Kimi endpoint policy
        run: |
          python scripts/mentat/vast_endpoint.py estimate \
            --hourly-price 28 \
            --hours 2
      - name: Verify endpoint creation requires cost acknowledgement
        run: |
          if python scripts/mentat/vast_endpoint.py create 2>error.log; then
            echo "create unexpectedly succeeded without cost acknowledgement" >&2
            exit 1
          fi
          grep -Fq -- '--accept-test-worker-cost' error.log
      - name: Verify Vast connection output
        run: |
          python scripts/mentat/vast_endpoint.py print-env >mentat-env.sh
          grep -Fq 'MENTAT_PROVIDER=vast' mentat-env.sh
          grep -Fq 'mentat-kimi-k2-7-code/v1' mentat-env.sh
      - name: Verify production inference and secret boundaries
        run: |
          grep -Fq 'MODEL_REF="vllm/mentat-auto"' scripts/mentat/launch.sh
          grep -Fq 'BROKER_BASE_URL="http://127.0.0.1:' scripts/mentat/launch.sh
          grep -Fq 'input: ["text"]' scripts/mentat/launch.sh
          grep -Fq '"mode":"all"' scripts/mentat/launch.sh
          grep -Fq 'tools.elevated.enabled false' scripts/mentat/launch.sh
          grep -Fq 'unset VAST_API_KEY VAST_TEMPLATE_HASH' scripts/mentat/launch.sh
          gateway_line="$(grep -n 'gateway --port' scripts/mentat/launch.sh | tail -1 | cut -d: -f1)"
          unset_line="$(grep -n 'unset VAST_API_KEY' scripts/mentat/launch.sh | tail -1 | cut -d: -f1)"
          test "$unset_line" -lt "$gateway_line"
      - name: Verify stable primary and text-only production registry
        run: |
          grep -Fq 'moonshotai/Kimi-K2.7-Code' config/model-registry.json
          grep -Fq '"require_measured_quality_for_non_primary": true' config/model-registry.json
          grep -Fq '"serverless_text_only": true' config/model-registry.json
      - name: Verify Ollama Cloud remains fallback only
        run: grep -Fq 'ollama-cloud)' scripts/mentat/launch.sh

  validate-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse native PowerShell scripts with Windows PowerShell
        shell: powershell
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'powershell-parse-errors.txt'
          Remove-Item $diagnostics -Force -ErrorAction SilentlyContinue
          $files = @(
            'install.ps1',
            'scripts/mentat/doctor.ps1',
            'scripts/mentat/launch.ps1',
            'scripts/mentat/mentat.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($parseError in $errors) {
              $message = '{0}:{1}:{2}: {3}' -f $file, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message
              Add-Content -LiteralPath $diagnostics -Value $message
              Write-Host "::error file=$file,line=$($parseError.Extent.StartLineNumber),col=$($parseError.Extent.StartColumnNumber)::$($parseError.Message)"
            }
          }
          if (Test-Path $diagnostics) {
            Get-Content $diagnostics
            exit 1
          }
      - name: Upload PowerShell parser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-parse-errors
          path: ${{ runner.temp }}/powershell-parse-errors.txt
          if-no-files-found: ignore
      - name: Verify CMD installer entry point
        shell: cmd
        run: install.cmd -Help | findstr /C:"Install Mentat natively on Windows"
      - name: Verify native command help
        shell: powershell
        run: |
          $env:MENTAT_HOME = $PWD.Path
          $output = & .\scripts\mentat\mentat.ps1 help 6>&1 | Out-String
          if ($output -notmatch 'mentat vast') { throw 'Native help is missing Vast commands.' }
          if ($output -notmatch 'mentat test no-spend') { throw 'Native help is missing no-spend diagnostics.' }
      - name: Verify Windows DPAPI protection
        shell: powershell
        run: |
          $secure = ConvertTo-SecureString 'mentat-ci-secret' -AsPlainText -Force
          $encrypted = ConvertFrom-SecureString $secure
          $restored = ConvertTo-SecureString $encrypted
          $pointer = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($restored)
          try { $plain = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($pointer) }
          finally { [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($pointer) }
          if ($plain -ne 'mentat-ci-secret') { throw 'DPAPI round-trip failed.' }
      - name: Compile endpoint, broker, and diagnostic tools on Windows
        shell: powershell
        run: |
          python -m py_compile `
            scripts/mentat/broker.py `
            scripts/mentat/vast_endpoint.py `
            scripts/mentat/vast_endpoint_production.py `
            scripts/mentat/vast_endpoint_hardening.py `
            scripts/mentat/vast_http.py `
            scripts/mentat/testing/fake_vast.py `
            scripts/mentat/testing/fake_openai.py `
            scripts/mentat/testing/no_spend_acceptance.py
          $env:MENTAT_BROKER_CLIENT_TOKEN = 'check-client'
          $env:MENTAT_BROKER_ADMIN_TOKEN = 'check-admin'
          python scripts/mentat/broker.py --root . --data-dir "$env:RUNNER_TEMP\broker" --check | Out-Null
      - name: Verify native production security boundary
        shell: powershell
        run: |
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch "'mentat-auto'" | Out-Null
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch "input = @('text')" | Out-Null
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch "mode = 'all'" | Out-Null
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch "tools.elevated.enabled" | Out-Null
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch 'Remove-Item Env:VAST_API_KEY' | Out-Null
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch 'Docker Desktop' | Out-Null
          Select-String -Path config/model-registry.json -SimpleMatch 'moonshotai/Kimi-K2.7-Code' | Out-Null
      - name: Smoke test native installer without dependency rebuild
        shell: cmd
        run: install.cmd -SkipDeps -SkipUI -SkipDesktop -NoPath
      - name: Verify installed Windows command wrappers
        shell: powershell
        run: |
          $mentat = Join-Path $env:LOCALAPPDATA 'Mentat\bin\mentat.cmd'
          if (-not (Test-Path $mentat)) { throw 'The native mentat.cmd wrapper was not installed.' }
          $help = & $mentat help | Out-String
          if ($help -notmatch 'native Windows control plane') { throw 'Installed command help failed.' }
          if ($help -notmatch 'mentat test no-spend') { throw 'Installed command omitted no-spend diagnostics.' }
          $version = & $mentat version | Out-String
          if ($version -notmatch '^Mentat ') { throw 'Installed command version failed.' }
      - name: Run installed no-spend acceptance command
        shell: powershell
        run: |
          $mentat = Join-Path $env:LOCALAPPDATA 'Mentat\bin\mentat.cmd'
          & $mentat test no-spend
          $commandExit = $LASTEXITCODE
          $reportPath = Join-Path $env:LOCALAPPDATA 'Mentat\state\no-spend-acceptance.json'
          $artifactPath = Join-Path $env:RUNNER_TEMP 'mentat-installed-no-spend-windows.json'
          if (Test-Path $reportPath) {
            Copy-Item -LiteralPath $reportPath -Destination $artifactPath -Force
          }
          if ($commandExit -ne 0) { throw "Installed no-spend command failed with exit code $commandExit." }
          if (-not (Test-Path $reportPath)) { throw 'Installed no-spend command did not create its report.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (-not $report.passed) { throw 'Installed no-spend report did not pass.' }
          if ($report.paid_compute_used) { throw 'No-spend report claimed paid compute was used.' }
      - name: Upload installed no-spend Windows report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentat-installed-no-spend-windows
          path: ${{ runner.temp }}/mentat-installed-no-spend-windows.json
          if-no-files-found: error
          retention-days: 30

name: Mentat Runtime

on:
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.cmd"
      - "README.md"
      - "config/mentat.env.example"
      - "scripts/mentat/**"
      - "infrastructure/vast/kimi-k2.7-code/**"
      - "docs/mentat/**"
      - ".github/workflows/mentat-runtime.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.cmd"
      - "README.md"
      - "config/mentat.env.example"
      - "scripts/mentat/**"
      - "infrastructure/vast/kimi-k2.7-code/**"
      - "docs/mentat/**"
      - ".github/workflows/mentat-runtime.yml"

permissions:
  contents: read

jobs:
  validate-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Mentat shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/mentat/install.sh
          bash -n scripts/mentat/launch.sh
          bash -n scripts/mentat/mentat.sh
          bash -n scripts/mentat/doctor.sh
      - name: Verify installer help
        run: bash install.sh --help | grep -Fq 'Install Mentat'
      - name: Verify unified command help
        run: bash scripts/mentat/mentat.sh help | grep -Fq 'mentat vast'
      - name: Verify local configuration path
        run: |
          output="$(MENTAT_CONFIG_DIR="$RUNNER_TEMP/mentat" bash scripts/mentat/mentat.sh config path)"
          test "$output" = "$RUNNER_TEMP/mentat/env"
      - name: Compile Vast endpoint CLI
        run: python -m py_compile scripts/mentat/vast_endpoint.py
      - name: Validate Kimi endpoint policy
        run: |
          python scripts/mentat/vast_endpoint.py estimate \
            --hourly-price 28 \
            --hours 2
      - name: Verify endpoint creation requires cost acknowledgement
        run: |
          if python scripts/mentat/vast_endpoint.py create 2>error.log; then
            echo "create unexpectedly succeeded without cost acknowledgement" >&2
            exit 1
          fi
          grep -Fq -- '--accept-test-worker-cost' error.log
      - name: Verify Vast connection output
        run: |
          python scripts/mentat/vast_endpoint.py print-env >mentat-env.sh
          grep -Fq 'MENTAT_PROVIDER=vast' mentat-env.sh
          grep -Fq 'mentat-kimi-k2-7-code/v1' mentat-env.sh
      - name: Verify Vast is the default inference route
        run: grep -Fq 'PROVIDER="${MENTAT_PROVIDER:-vast}"' scripts/mentat/launch.sh
      - name: Verify stable self-hosted model
        run: grep -Fq 'MODEL_ID="${MENTAT_MODEL_ID:-moonshotai/Kimi-K2.7-Code}"' scripts/mentat/launch.sh
      - name: Verify Ollama Cloud remains fallback only
        run: grep -Fq 'ollama-cloud)' scripts/mentat/launch.sh

  validate-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse native PowerShell scripts with Windows PowerShell
        shell: powershell
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'powershell-parse-errors.txt'
          Remove-Item $diagnostics -Force -ErrorAction SilentlyContinue
          $files = @(
            'install.ps1',
            'scripts/mentat/doctor.ps1',
            'scripts/mentat/launch.ps1',
            'scripts/mentat/mentat.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($parseError in $errors) {
              $message = '{0}:{1}:{2}: {3}' -f $file, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message
              Add-Content -LiteralPath $diagnostics -Value $message
              Write-Host "::error file=$file,line=$($parseError.Extent.StartLineNumber),col=$($parseError.Extent.StartColumnNumber)::$($parseError.Message)"
            }
          }
          if (Test-Path $diagnostics) {
            Get-Content $diagnostics
            exit 1
          }
      - name: Upload PowerShell parser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-parse-errors
          path: ${{ runner.temp }}/powershell-parse-errors.txt
          if-no-files-found: ignore
      - name: Verify CMD installer entry point
        shell: cmd
        run: install.cmd -Help | findstr /C:"Install Mentat natively on Windows"
      - name: Verify native command help
        shell: powershell
        run: |
          $env:MENTAT_HOME = $PWD.Path
          $output = & .\scripts\mentat\mentat.ps1 help | Out-String
          if ($output -notmatch 'mentat vast') { throw 'Native help is missing Vast commands.' }
      - name: Verify Windows DPAPI protection
        shell: powershell
        run: |
          $secure = ConvertTo-SecureString 'mentat-ci-secret' -AsPlainText -Force
          $encrypted = ConvertFrom-SecureString $secure
          $restored = ConvertTo-SecureString $encrypted
          $pointer = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($restored)
          try { $plain = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($pointer) }
          finally { [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($pointer) }
          if ($plain -ne 'mentat-ci-secret') { throw 'DPAPI round-trip failed.' }
      - name: Compile Vast endpoint CLI on Windows
        shell: powershell
        run: python -m py_compile scripts/mentat/vast_endpoint.py
      - name: Verify native model and provider defaults
        shell: powershell
        run: |
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch "moonshotai/Kimi-K2.7-Code" | Out-Null
          Select-String -Path scripts/mentat/launch.ps1 -SimpleMatch "'vast'" | Out-Null

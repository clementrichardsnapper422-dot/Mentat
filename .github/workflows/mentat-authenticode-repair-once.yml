name: Mentat Authenticode Repair

on:
  pull_request:
    paths:
      - ".github/workflows/mentat-authenticode-repair-once.yml"

permissions:
  contents: read

concurrency:
  group: mentat-authenticode-repair
  cancel-in-progress: true

jobs:
  validate-windows:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/shot2-owner-gate1-evidence'
    runs-on: windows-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/shot2-owner-gate1-evidence
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Authenticode invocation repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/mentat/release_artifacts.py")
          text = path.read_text(encoding="utf-8")
          old = '''    script = (
              "$s=Get-AuthenticodeSignature -LiteralPath $args[0];"
              "@{Status=[string]$s.Status;StatusMessage=$s.StatusMessage;"
              "Signer=if($s.SignerCertificate){$s.SignerCertificate.Subject}else{$null};"
              "Thumbprint=if($s.SignerCertificate){$s.SignerCertificate.Thumbprint}else{$null}}"
              "|ConvertTo-Json -Compress"
          )
          result = subprocess.run(
              ["powershell.exe", "-NoLogo", "-NoProfile", "-Command", script, str(path)],
              text=True,
              capture_output=True,
              check=False,
          )'''
          new = '''    script = (
              "$p=[Environment]::GetEnvironmentVariable('MENTAT_AUTHENTICODE_PATH');"
              "if([string]::IsNullOrWhiteSpace($p)){throw 'Authenticode path is missing'};"
              "$s=Get-AuthenticodeSignature -LiteralPath $p;"
              "@{Status=[string]$s.Status;StatusMessage=$s.StatusMessage;"
              "Signer=if($s.SignerCertificate){$s.SignerCertificate.Subject}else{$null};"
              "Thumbprint=if($s.SignerCertificate){$s.SignerCertificate.Thumbprint}else{$null}}"
              "|ConvertTo-Json -Compress"
          )
          environment = os.environ.copy()
          environment["MENTAT_AUTHENTICODE_PATH"] = str(path)
          result = subprocess.run(
              ["powershell.exe", "-NoLogo", "-NoProfile", "-Command", script],
              text=True,
              capture_output=True,
              check=False,
              env=environment,
          )'''
          if old not in text:
              raise SystemExit("Authenticode invocation marker is missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Test metadata generation with spaced Windows path
        shell: powershell
        run: |
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'Mentat release fixture with spaces'
          $payloadDir = Join-Path $fixtureDir 'payload'
          $outputDir = Join-Path $fixtureDir 'metadata output'
          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
          Copy-Item -LiteralPath (Get-Command python).Source -Destination (Join-Path $fixtureDir 'Mentat Fixture.exe')
          Set-Content -LiteralPath (Join-Path $payloadDir 'payload.txt') -Value 'fixture'
          python scripts/mentat/release_artifacts.py `
            --artifact (Join-Path $fixtureDir 'Mentat Fixture.exe') `
            --payload-root $payloadDir `
            --output-dir $outputDir
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata fixture failed.' }
          $metadata = Get-Content -LiteralPath (Join-Path $outputDir 'mentat-release-metadata.json') -Raw | ConvertFrom-Json
          if (-not $metadata.artifact.authenticode.checked) { throw 'Authenticode was not checked.' }
          if ([string]::IsNullOrWhiteSpace([string]$metadata.artifact.authenticode.Status)) {
            throw 'Authenticode status is missing.'
          }
          foreach ($required in @('SHA256SUMS', 'mentat-provenance.intoto.json', 'mentat-sbom.cdx.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $outputDir $required))) {
              throw "Release metadata output is missing: $required"
            }
          }
      - name: Compile repaired script
        run: python -m py_compile scripts/mentat/release_artifacts.py

  publish:
    needs: validate-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/shot2-owner-gate1-evidence
          fetch-depth: 1
      - name: Apply validated Authenticode repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/mentat/release_artifacts.py")
          text = path.read_text(encoding="utf-8")
          old = '''    script = (
              "$s=Get-AuthenticodeSignature -LiteralPath $args[0];"
              "@{Status=[string]$s.Status;StatusMessage=$s.StatusMessage;"
              "Signer=if($s.SignerCertificate){$s.SignerCertificate.Subject}else{$null};"
              "Thumbprint=if($s.SignerCertificate){$s.SignerCertificate.Thumbprint}else{$null}}"
              "|ConvertTo-Json -Compress"
          )
          result = subprocess.run(
              ["powershell.exe", "-NoLogo", "-NoProfile", "-Command", script, str(path)],
              text=True,
              capture_output=True,
              check=False,
          )'''
          new = '''    script = (
              "$p=[Environment]::GetEnvironmentVariable('MENTAT_AUTHENTICODE_PATH');"
              "if([string]::IsNullOrWhiteSpace($p)){throw 'Authenticode path is missing'};"
              "$s=Get-AuthenticodeSignature -LiteralPath $p;"
              "@{Status=[string]$s.Status;StatusMessage=$s.StatusMessage;"
              "Signer=if($s.SignerCertificate){$s.SignerCertificate.Subject}else{$null};"
              "Thumbprint=if($s.SignerCertificate){$s.SignerCertificate.Thumbprint}else{$null}}"
              "|ConvertTo-Json -Compress"
          )
          environment = os.environ.copy()
          environment["MENTAT_AUTHENTICODE_PATH"] = str(path)
          result = subprocess.run(
              ["powershell.exe", "-NoLogo", "-NoProfile", "-Command", script],
              text=True,
              capture_output=True,
              check=False,
              env=environment,
          )'''
          if old not in text:
              raise SystemExit("Authenticode invocation marker is missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Verify source integrity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/mentat/release_artifacts.py
          git diff --check
      - name: Remove repair workflow and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mentat-authenticode-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: pass Authenticode artifact path safely"
          git push origin HEAD:agent/shot2-owner-gate1-evidence

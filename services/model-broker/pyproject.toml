[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mentat-model-broker"
version = "0.1.0"
description = "Deterministic model and Vast compute broker for Mentat"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mentat-broker = "mentat_broker.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mentat_broker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
